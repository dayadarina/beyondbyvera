<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Beyond by Vera — Reviews &amp; The Journal</title>
    <meta name="description" content="A journal of reviews, reflections, and the moments these pieces were made for. Stories from women who wear Beyond by Vera." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://beyondbyvera-journal.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Beyond by Vera Journal" />
    <meta property="og:title" content="Beyond by Vera — Reviews &amp; The Journal" />
    <meta property="og:description" content="A journal of reviews, reflections, and the moments these pieces were made for. Stories from women who wear Beyond by Vera." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://beyondbyvera-journal.com/" />
    <meta property="og:image" content="https://beyondbyvera-journal.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@beyondbyvera" />
    <meta name="twitter:title" content="Beyond by Vera — Reviews &amp; The Journal" />
    <meta name="twitter:description" content="A journal of reviews, reflections, and the moments these pieces were made for." />
    <meta name="twitter:image" content="https://beyondbyvera-journal.com/og-default.jpg" />

    <!-- Structured data: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Beyond by Vera Journal",
      "url": "https://beyondbyvera-journal.com",
      "description": "A journal of reviews, reflections, and the moments these pieces were made for. Stories from women who wear Beyond by Vera.",
      "publisher": {
        "@type": "Organization",
        "name": "Beyond by Vera",
        "url": "https://beyondbyvera.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://beyondbyvera-journal.com/favicon.svg"
        }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://beyondbyvera-journal.com/journal?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
